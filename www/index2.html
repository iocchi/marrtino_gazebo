<body>
<h1 align="center">MARRtino gazebo</h1>


<p><span style="font-size:24px"> Status </span> &nbsp;&nbsp;&nbsp; <span id="status"  style="color: blue; font-size:24px">Not Connected</span></p>

<p><span style="font-size:24px"> Message </span> &nbsp;&nbsp;&nbsp; <span id="message"  style="color: red; font-size:24px"> </span></p>

<p>
<a target="_blank" href="test1.html">Controller</a>

<p>
<a target="_blank" href="/viewer">Viewer</a>

</body>

<script>

    // websocket global variable
    var websocket = null;
    var ip = window.location.hostname;
    const url = "ws://" + ip + ":3080/code_ws"
    console.log("URL: "+url);
    websocket = new WebSocket(url);

    websocket.onmessage = function (event) {
      console.log("message received: " + event.data);
      document.getElementById("message").innerHTML = event.data;
    }

    websocket.onopen = function () {
      console.log("connection received");
      console.log("websocket state: " + this.readyState);
      document.getElementById("status").innerHTML = "Connected";
    }

    websocket.onclose = function () {
      console.log("connection closed");
      document.getElementById("status").innerHTML = "Closed";
    }

    websocket.onerror = function () {
      console.log("!!!connection error!!!");
      document.getElementById("status").innerHTML = "Error !!!";
    }

</script>

</html>
